name: Supabase Keepalive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent project pause
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hbhlnbxfjeqvznjqzame.supabase.co/rest/v1/reports?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Supabase returned $STATUS"
            exit 1
          fi
          echo "OK: Supabase is alive"
